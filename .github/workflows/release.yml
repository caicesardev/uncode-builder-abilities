name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Build and publish the plugin ZIP
    runs-on: ubuntu-latest
    env:
      SLUG: uncode-builder-abilities
    steps:
      - uses: actions/checkout@v7

      - name: Check that the tag matches the plugin version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          header=$(sed -n 's/^ \* Version: *//p' "$SLUG.php")
          constant=$(sed -n "s/^define( 'UNCODE_BUILDER_ABILITIES_VERSION', '\(.*\)' );/\1/p" "$SLUG.php")
          stable=$(sed -n 's/^Stable tag: *//p' readme.txt)
          echo "tag=$tag header=$header constant=$constant stable=$stable"
          test "$tag" = "$header" && test "$tag" = "$constant" && test "$tag" = "$stable"

      - name: Build the ZIP without development files
        run: |
          mkdir -p "build/$SLUG"
          rsync -a --exclude-from=.distignore ./ "build/$SLUG/"
          (cd build && zip -qr "../$SLUG-${GITHUB_REF_NAME#v}.zip" "$SLUG")
          unzip -l "$SLUG-${GITHUB_REF_NAME#v}.zip"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "$SLUG-${GITHUB_REF_NAME#v}.zip" --title "$GITHUB_REF_NAME" --generate-notes
